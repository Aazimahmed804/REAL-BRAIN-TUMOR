<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MRI Tumor Detection System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0a0d12;
    --panel:#12161d;
    --panel-raised:#171c24;
    --line:#232b36;
    --phosphor:#6ee7c0;
    --phosphor-dim:#3f8f76;
    --amber:#ffb454;
    --text:#e7ecef;
    --muted:#8b96a3;
    --danger:#ff6b6b;
  }
  .scanfield{
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;   /* yeh line add karo */
  background-image: ...
  ...
}
  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    background:var(--ink);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    overflow-x:hidden;
  }

  /* ambient scan grid */
  .scanfield{
    position:fixed;
    inset:0;
    z-index:0;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size:42px 42px;
    opacity:0.35;
    mask-image:radial-gradient(ellipse 70% 60% at 50% 30%, black 10%, transparent 75%);
  }

  .scanfield::after{
    content:'';
    position:absolute;
    left:0; right:0;
    height:140px;
    top:-140px;
    background:linear-gradient(180deg, transparent, rgba(110,231,192,0.10), transparent);
    animation:sweep 7s linear infinite;
  }

  @keyframes sweep{
    0%{ top:-140px; }
    100%{ top:100vh; }
  }

  .container{
    position:relative;
    z-index:1;
    max-width:640px;
    margin:0 auto;
    padding:72px 24px 48px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .masthead{
    text-align:center;
    margin-bottom:44px;
  }

  .eyebrow{
    display:inline-block;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.16em;
    color:var(--phosphor);
    border:1px solid var(--phosphor-dim);
    background:rgba(110,231,192,0.06);
    padding:5px 12px;
    border-radius:2px;
    margin-bottom:20px;
  }

  h1{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:clamp(28px, 5vw, 40px);
    line-height:1.15;
    margin:0 0 14px;
    letter-spacing:-0.01em;
  }

  .lede{
    font-size:15px;
    color:var(--muted);
    line-height:1.6;
    margin:0 auto;
    max-width:440px;
  }

  /* viewport card, styled like an imaging viewer */
  .viewport-card{
    position:relative;
    width:100%;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:6px;
    padding:40px 32px 28px;
  }

  .corner{
    position:absolute;
    width:18px;
    height:18px;
    border:2px solid var(--phosphor);
    opacity:0.7;
  }
  .corner.tl{ top:-1px; left:-1px; border-right:none; border-bottom:none; border-top-left-radius:6px; }
  .corner.tr{ top:-1px; right:-1px; border-left:none; border-bottom:none; border-top-right-radius:6px; }
  .corner.bl{ bottom:-1px; left:-1px; border-right:none; border-top:none; border-bottom-left-radius:6px; }
  .corner.br{ bottom:-1px; right:-1px; border-left:none; border-top:none; border-bottom-right-radius:6px; }

  form{
    display:flex;
    flex-direction:column;
    gap:20px;
  }

  .dropzone{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:10px;
    text-align:center;
    padding:44px 20px;
    border:1.5px dashed var(--line);
    border-radius:4px;
    background:var(--panel-raised);
    cursor:pointer;
    transition:border-color 0.2s ease, background 0.2s ease;
  }

  .dropzone:hover,
  .dropzone.drag-over{
    border-color:var(--phosphor);
    background:rgba(110,231,192,0.05);
  }

  .dropzone:focus-within{
    outline:2px solid var(--phosphor);
    outline-offset:2px;
  }

  .dz-icon{
    color:var(--phosphor);
    opacity:0.9;
  }

  .dz-title{
    font-family:'Space Grotesk',sans-serif;
    font-size:16px;
    font-weight:500;
  }

  .dz-meta{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.04em;
    color:var(--muted);
  }

  .dz-filename{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--phosphor);
    word-break:break-all;
    min-height:16px;
  }

  .scan-btn{
    font-family:'Space Grotesk',sans-serif;
    font-size:15px;
    font-weight:600;
    letter-spacing:0.01em;
    color:var(--ink);
    background:var(--phosphor);
    border:none;
    border-radius:4px;
    padding:15px 20px;
    cursor:pointer;
    transition:transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
  }

  .scan-btn:hover{
    background:#82f0cc;
    box-shadow:0 0 0 4px rgba(110,231,192,0.15);
  }

  .scan-btn:active{
    transform:translateY(1px);
  }

  .scan-btn:focus-visible{
    outline:2px solid var(--amber);
    outline-offset:3px;
  }

  .status-bar{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:20px;
    padding-top:16px;
    border-top:1px solid var(--line);
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.06em;
    color:var(--muted);
  }

  .status-dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--muted);
    flex-shrink:0;
  }

  .status-dot.ready{
    background:var(--phosphor);
    box-shadow:0 0 6px var(--phosphor);
  }

  .disclaimer{
    margin-top:28px;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:0.06em;
    color:var(--muted);
    text-align:center;
    max-width:480px;
    line-height:1.6;
  }

  @media (max-width:480px){
    .container{ padding:48px 16px 32px; }
    .viewport-card{ padding:32px 18px 22px; }
    .dropzone{ padding:32px 14px; }
  }

  @media (prefers-reduced-motion: reduce){
    .scanfield::after{ animation:none; display:none; }
  }

  .result{
  width:100%;
  max-width:640px;
  margin:24px auto 0;
}

.cardshadow{
  position:relative;
  border-radius:6px;
  padding:1px; /* border ki jagah gradient glow ke liye */
  background:linear-gradient(135deg, var(--phosphor-dim), transparent 60%);
}

.cardbody{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:5px;
  padding:24px 28px;
  text-align:center;
}

.result-eyebrow{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  letter-spacing:0.14em;
  color:var(--muted);
}

.result-label{
  font-family:'Space Grotesk',sans-serif;
  font-size:22px;
  font-weight:600;
  margin:10px 0 6px;
  color:var(--phosphor);
}

.result-confidence{
  font-family:'IBM Plex Mono',monospace;
  font-size:13px;
  letter-spacing:0.05em;
  color:var(--muted);
  margin:0;
}

.result-confidence span{
  color:var(--text);
  font-weight:500;
}
.scan-preview{
  position:relative;
  width:100%;
  max-width:320px;
  margin:16px auto 20px;
  border-radius:4px;
  overflow:hidden;
  border:1px solid var(--line);
  background:var(--panel-raised);
}

.scan-preview img{
  display:block;
  width:100%;
  height:auto;
  max-height:320px;
  object-fit:contain;
  filter:grayscale(15%) contrast(1.05);
}

.scan-tag{
  position:absolute;
  top:8px;
  left:8px;
  font-family:'IBM Plex Mono',monospace;
  font-size:10px;
  letter-spacing:0.12em;
  color:var(--phosphor);
  background:rgba(10,13,18,0.75);
  border:1px solid var(--phosphor-dim);
  padding:2px 6px;
  border-radius:2px;
}
</style>
</head>
<body>
<div class="scanfield" aria-hidden="true"></div>
<nav class="top-nav">
  <a href="{{ url_for('index') }}">Upload</a>
  <a href="{{ url_for('history') }}">History</a>
</nav>
{% block content %}{% endblock %}
</body>
</html>
